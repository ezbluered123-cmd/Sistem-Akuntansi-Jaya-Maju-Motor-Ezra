const bs=D.items.filter(x=>x.type=='barang');return tb+`<div class="card" style="max-width:820px;line-height:1.7"><h2 style="font-size:19px">Catatan atas Laporan Keuangan</h2><div class="mu">${esc(D.co)} · per ${up}</div><h3>1. Informasi umum</h3><p>${esc(D.co)} adalah usaha perorangan yang bergerak di bidang perdagangan suku cadang sepeda motor dan jasa servis kendaraan.</p><h3>2. Dasar penyusunan</h3><p>Laporan keuangan disusun berdasarkan Standar Akuntansi Keuangan Entitas Mikro, Kecil, dan Menengah (SAK EMKM) dengan basis akrual dan mata uang Rupiah. Laporan terdiri atas posisi keuangan, laba rugi, arus kas, perubahan ekuitas, dan CALK.</p><h3>3. Kebijakan akuntansi</h3><p><b>Persediaan</b> diukur sebesar biaya perolehan dengan metode masuk pertama keluar pertama (FIFO) secara perpetual. <b>Pendapatan</b> diakui saat barang diserahkan atau jasa selesai diberikan. <b>Peralatan</b> dicatat sebesar biaya perolehan dikurangi akumulasi penyusutan (garis lurus).</p><h3>4. Rincian akun</h3><div class="tw"><table>${R('Kas',g('1-1100'))+R('Bank',g('1-1200'))+R('Piutang usaha',g('1-1300'))+R('Persediaan (FIFO)',g('1-1400'))+R('Peralatan, neto',g('1-2100')+g('1-2900'))+R('Utang usaha',-g('2-1100'))+R('Utang pajak PPh final',-g('2-1200'))+R('Pendapatan penjualan barang',-g('4-1000'))+R('Pendapatan jasa',-g('4-2000'))}</table></div><h3>5. Perpajakan</h3><p>Status wajib pajak: ${WPN[D.tax]}. ${D.tax=='lain'?'Bentuk usaha ini tidak memenuhi syarat PPh Final UMKM, sehingga pajak penghasilan mengikuti ketentuan umum.':'Penghasilan usaha dikenai PPh Final 0,5% dari omzet bruto sesuai PP 55 Tahun 2022 sebagaimana diubah PP 20 Tahun 2026, dengan omzet sampai Rp4,8 miliar per tahun. '+(D.tax=='op'?'Omzet Rp500 juta pertama per tahun tidak dikenai pajak. ':'')+'Beban pajak disajikan setelah laba sebelum pajak, dan utang pajak disetor paling lambat tanggal 15 bulan berikutnya.'}</p><h3>6. Rincian persediaan</h3>${TB(['Barang','Jumlah','Nilai'],bs.map(x=>`<tr><td>${esc(x.name)}</td><td>${stk(x.id)} ${x.unit}</td><td class="n">${rp(sv(x.id))}</td></tr>`))}</div>`}};
/* ===== transaksi & CRUD ===== */
function del(id){if(!confirm('Hapus data ini? Jurnal dan lapisan FIFO dihitung ulang otomatis.'))return;D.trx=D.trx.filter(t=>t.id!=id);refresh();toast('Data dihapus')}
const bo=()=>D.items.filter(x=>x.type=='barang').map(x=>[x.id,x.id+' · '+x.name]),po=[['tunai','Tunai'],['bank','Transfer bank'],['kredit','Kredit']];
function buyF(){if(!D.sup.length){toast('Tambah data pemasok dulu');return supF()}form('Pembelian baru',[{k:'date',l:'Tanggal',t:'date',v:today()},{k:'sup',l:'Pemasok',o:D.sup.map(s=>[s.name,s.name])},{k:'i',l:'Barang',o:bo()},{k:'q',l:'Jumlah',t:'number',v:1},{k:'c',l:'Harga beli per unit',t:'number',v:''},{k:'pay',l:'Pembayaran',o:po}],v=>{if(+v.q<=0||+v.c<=0){toast('Jumlah dan harga harus lebih dari 0');return false}D.trx.push({id:nid(),t:'buy',date:v.date,sup:v.sup,i:v.i,q:+v.q,c:+v.c,pay:v.pay});const it=item(v.i);it.cost=+v.c;if(D.set.auto)it.price=prc(it);refresh();toast('Pembelian dicatat, jurnal otomatis dibuat'+(D.set.auto?', harga jual diperbarui dari margin':''))})}
function adjF(){form('Adjustment persediaan',[{k:'date',l:'Tanggal',t:'date',v:today()},{k:'i',l:'Barang',o:bo()},{k:'q',l:'Selisih jumlah (+ lebih / − kurang)',t:'number',v:-1},{k:'c',l:'Harga per unit (untuk selisih +)',t:'number',v:0},{k:'why',l:'Alasan',v:''}],v=>{const q=+v.q;if(!q||(q<0&&-q>stk(v.i))||(q>0&&+v.c<=0)){toast('Periksa jumlah (maks. sesuai stok) dan harga');return false}D.trx.push({id:nid(),t:'adj',date:v.date,i:v.i,q,c:+v.c,why:v.why});refresh();toast('Adjustment dicatat')})}
function itF(id){const x=id?item(id):{id:'',name:'',type:'barang',unit:'pcs',price:'',cost:0,min:D.set.minstok,mg:''};form(id?'Ubah barang/jasa':'Tambah barang/jasa',[{k:'id',l:'Kode',v:x.id,ro:!!id},{k:'name',l:'Nama',v:x.name},{k:'type',l:'Jenis',v:x.type,o:[['barang','Barang dagangan'],['jasa','Jasa']]},{k:'unit',l:'Satuan',v:x.unit},{k:'cost',l:'Harga beli standar',t:'number',v:x.cost},{k:'mg',l:'Margin % (kosong = margin default '+D.set.margin+'%)',t:'number',v:x.mg??'',nr:1},{k:'price',l:'Harga jual (kosong/0 = otomatis dari margin)',t:'number',v:x.price,nr:1},{k:'min',l:'Stok minimum',t:'number',v:x.min}],v=>{if(!id&&item(v.id)){toast('Kode sudah dipakai');return false}const o={id:v.id,name:v.name,type:v.type,unit:v.unit,price:+v.price,cost:+v.cost,min:+v.min,mg:v.mg===''?undefined:+v.mg};if(v.type=='barang'&&!o.price)o.price=prc(o);if(!o.price){toast('Harga jual belum terisi: isi harga jual atau harga beli');return false}id?Object.assign(x,o):D.items.push(o);refresh();toast('Tersimpan')})}
function itD(id){if(D.trx.some(t=>t.i==id||(t.lines&&t.lines.some(l=>l.i==id))))return toast('Tidak bisa dihapus: sudah dipakai transaksi');if(confirm('Hapus '+nm(id)+'?')){D.items=D.items.filter(x=>x.id!=id);refresh()}}
function coF(c){const a=c&&D.coa.find(x=>x[0]==c);form(c?'Ubah akun':'Akun baru',[{k:'c',l:'Kode (contoh 6-4000)',v:c||'',ro:!!c},{k:'n',l:'Nama akun',v:a?a[1]:''}],v=>{if(!/^[1-6]-\d{4}$/.test(v.c)){toast('Format kode: 6-4000 (angka awal 1–6)');return false}if(!c&&D.coa.some(x=>x[0]==v.c)){toast('Kode sudah ada');return false}c?a[1]=v.n:(D.coa.push([v.c,v.n]),D.coa.sort((x,y)=>x[0].localeCompare(y[0])));refresh()})}
function coD(c){if(C.J.some(j=>j.l.some(l=>l[0]==c)))return toast('Tidak bisa dihapus: akun sudah memiliki jurnal');if(confirm('Hapus akun '+c+'?')){D.coa=D.coa.filter(a=>a[0]!=c);refresh()}}
function jvF(){const ao=D.coa.map(a=>[a[0],a[0]+' '+a[1]]);form('Jurnal manual',[{k:'kind',l:'Jenis',o:[['umum','Jurnal umum'],['penyesuaian','Jurnal penyesuaian']]},{k:'date',l:'Tanggal',t:'date',v:today()},{k:'memo',l:'Keterangan',v:''},{k:'dr',l:'Akun didebit',o:ao},{k:'cr',l:'Akun dikredit',o:ao,v:'1-1100'},{k:'amt',l:'Nominal',t:'number',v:''}],v=>{if(v.dr==v.cr||+v.amt<=0){toast('Akun harus berbeda dan nominal lebih dari 0');return false}D.trx.push({id:nid(),t:'jv',kind:v.kind,date:v.date,memo:v.memo,lines:[[v.dr,+v.amt,0],[v.cr,0,+v.amt]]});refresh();toast('Jurnal dicatat')})}
/* ===== pengaturan, pemasok, margin ===== */
function mig(){D.set=Object.assign({margin:25,round:500,auto:1,minstok:5,owner:'',biz:'Perdagangan suku cadang dan jasa servis motor',addr:'',phone:'',email:'',npwp:'',nib:''},D.set);D.tax=D.tax||'op';D.sup=D.sup||[...new Set(D.trx.filter(t=>t.t=='buy').map(t=>t.sup))].map((n,i)=>({id:'S'+(i+1),name:n,phone:'',addr:'',note:''}))}
function mgOf(x){return x.mg??D.set.margin}
function prc(x){const r=D.set.round||1;return Math.ceil(x.cost*(1+mgOf(x)/100)/r)*r}
function mgAll(){if(!confirm('Hitung ulang harga jual semua barang dari harga beli + margin?'))return;D.items.forEach(x=>{if(x.type=='barang'&&x.cost)x.price=prc(x)});refresh();toast('Harga jual diperbarui')}
function supF(id){const s=id?D.sup.find(x=>x.id==id):{name:'',phone:'',addr:'',note:''};form(id?'Ubah pemasok':'Tambah pemasok',[{k:'name',l:'Nama pemasok',v:s.name},{k:'phone',l:'Telepon',v:s.phone,nr:1},{k:'addr',l:'Alamat',v:s.addr,nr:1},{k:'note',l:'Catatan (mis. termin bayar)',v:s.note,nr:1}],v=>{const n=v.name.trim();if(D.sup.some(x=>x.name.toLowerCase()==n.toLowerCase()&&x.id!=id)){toast('Nama pemasok sudah ada');return false}if(id){if(s.name!=n)D.trx.forEach(t=>{if(t.sup==s.name)t.sup=n});Object.assign(s,{name:n,phone:v.phone,addr:v.addr,note:v.note})}else D.sup.push({id:'S'+Date.now().toString(36),name:n,phone:v.phone,addr:v.addr,note:v.note});refresh();toast('Pemasok tersimpan')})}
function supD(id){const s=D.sup.find(x=>x.id==id);if(D.trx.some(t=>t.sup==s.name))return toast('Tidak bisa dihapus: pemasok sudah punya transaksi');if(confirm('Hapus pemasok '+s.name+'?')){D.sup=D.sup.filter(x=>x.id!=id);refresh()}}
function idF(){const s=D.set;form('Identitas UMKM',[{k:'n',l:'Nama usaha',v:D.co},{k:'tax',l:'Bentuk usaha / status wajib pajak',v:D.tax,o:Object.entries(WPN)},{k:'owner',l:'Nama pemilik',v:s.owner,nr:1},{k:'biz',l:'Bidang usaha',v:s.biz,nr:1},{k:'addr',l:'Alamat',v:s.addr,nr:1},{k:'phone',l:'Telepon',v:s.phone,nr:1},{k:'email',l:'Email',v:s.email,nr:1},{k:'npwp',l:'NPWP',v:s.npwp,nr:1},{k:'nib',l:'NIB',v:s.nib,nr:1}],v=>{D.co=v.n.trim();D.tax=v.tax;['owner','biz','addr','phone','email','npwp','nib'].forEach(k=>s[k]=v[k].trim());$('#cn').textContent=D.co;refresh();toast('Identitas disimpan')})}
function prF(){const s=D.set;form('Harga & persediaan',[{k:'margin',l:'Margin default (% dari harga beli)',t:'number',v:s.margin},{k:'round',l:'Pembulatan harga jual',v:s.round,o:[['1','Tanpa pembulatan'],['100','Kelipatan Rp100'],['500','Kelipatan Rp500'],['1000','Kelipatan Rp1.000']]},{k:'auto',l:'Perbarui harga jual otomatis saat pembelian',v:s.auto,o:[['1','Aktif'],['0','Nonaktif']]},{k:'minstok',l:'Stok minimum default barang baru',t:'number',v:s.minstok}],v=>{if(+v.margin<0||+v.minstok<0){toast('Nilai tidak boleh negatif');return false}Object.assign(s,{margin:+v.margin,round:+v.round,auto:+v.auto,minstok:+v.minstok});refresh();toast('Pengaturan disimpan. Gunakan Terapkan margin ke semua di menu Barang & Jasa untuk menghitung ulang harga.')})}
function pwF(){form('Ubah kata sandi',[{k:'o',l:'Kata sandi lama',t:'password'},{k:'n',l:'Kata sandi baru (min. 6 karakter)',t:'password'},{k:'n2',l:'Ulangi kata sandi baru',t:'password'}],v=>{(async()=>{if(await sha(v.o.trim())!=U.h){toast('Kata sandi lama salah');return}if(v.n.trim().length<6||v.n!==v.n2){toast('Kata sandi baru minimal 6 karakter dan harus sama');return}U.h=await sha(v.n.trim());save();md.close();toast('Kata sandi diubah')})();return false})}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='ledgerku-cadangan-'+today()+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.trx||!d.items||!d.coa||!d.users)throw 0;if(!confirm('Impor akan menimpa semua data saat ini. Lanjutkan?'))return;D=d;mig();U=D.users.find(x=>x.u==U.u)||D.users[0];$('#cn').textContent=D.co;refresh();toast('Data berhasil diimpor')}catch(e){toast('File cadangan tidak valid')}};r.readAsText(f)}
function rst(){if(confirm('Hapus SEMUA data termasuk akun? Tindakan ini tidak bisa dibatalkan.')){try{localStorage.removeItem(KEY);sessionStorage.removeItem('lk_u')}catch(e){}location.reload()}}
/* ===== pajak ===== */
function taxM(){const ref=maxd(),yr=ref.slice(0,4),w=D.tax,rows=[];let cum=0;for(let m=1;m<=+ref.slice(5,7);m++){const y=yr+'-'+String(m).padStart(2,'0'),o=mon(y).r,after=cum+o,dpp=w=='lain'?0:w=='op'?Math.max(0,Math.min(o,after-5e8)):o;cum=after;rows.push({y,o,dpp,tx:Math.round(dpp*.005),acc:D.trx.find(t=>t.tx=='acc'&&t.ym==y),paid:D.trx.find(t=>t.tx=='pay'&&t.ym==y)})}return{rows,ytd:cum}}
function taxA(y,a){const e=new Date(+y.slice(0,4),+y.slice(5),0).toLocaleDateString('sv');D.trx.push({id:nid(),t:'jv',kind:'umum',tx:'acc',ym:y,date:e<today()?e:today(),memo:'PPh Final 0,5% masa '+y,lines:[['6-4000',a,0],['2-1200',0,a]]});refresh();toast('Pajak dicatat sebagai beban dan utang pajak')}
function taxP(y){const a=D.trx.find(t=>t.tx=='acc'&&t.ym==y).lines[0][1];form('Setor PPh Final masa '+y,[{k:'acc',l:'Dibayar dari',o:[['1-1100','Kas'],['1-1200','Bank']]},{k:'date',l:'Tanggal setor',t:'date',v:today()}],v=>{D.trx.push({id:nid(),t:'jv',kind:'umum',tx:'pay',ym:y,date:v.date,memo:'Setor PPh Final masa '+y,lines:[['2-1200',a,0],[v.acc,0,a]]});refresh();toast('Penyetoran dicatat')})}
function wpF(){form('Status wajib pajak',[{k:'w',l:'Bentuk wajib pajak',v:D.tax,o:Object.entries(WPN)}],v=>{D.tax=v.w;refresh()})}
/* ===== Direct Sales (pengganti UserForm VBA) ===== */
function openDS(){cart=[];md.innerHTML=`<div class="fm"><div class="top" style="margin:0"><h3>⚡ Direct Sales</h3><button onclick="md.close()">✕ Tutup</button></div><div class="g2"><div><input id="q" placeholder="Cari barang atau jasa…" oninput="dsF()"><div id="res"></div></div><div><div id="cart"></div><label>Pembayaran<select id="pay" onchange="dsC()">${po.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label><label id="cl">Uang diterima<input id="cash" type="number" oninput="dsC()"></label><div id="chg" style="font-weight:700;margin:6px 0"></div><button class="p" style="width:100%" onclick="dsPay()">💳 Bayar</button></div></div></div>`;md.showModal();dsF();dsC();$('#q').focus()}
function dsF(){const q=$('#q').value.toLowerCase();$('#res').innerHTML=D.items.filter(x=>(x.id+x.name).toLowerCase().includes(q)).map(x=>`<div class="rw"><div><b>${esc(x.name)}</b><br><small class="mu">${x.id} · ${x.type=='jasa'?'jasa':'stok '+stk(x.id)} · ${rp(x.price)}</small></div><button class="p" onclick="dsA('${x.id}')">+ Tambah</button></div>`).join('')||'<div class="mu">Tidak ditemukan.</div>'}
function dsA(i){const c=cart.find(x=>x.i==i);if(item(i).type=='barang'&&(c?c.q:0)+1>stk(i))return toast('Stok tidak cukup');c?c.q++:cart.push({i,q:1});dsC()}
function dsQ(i,v){const it=item(i);let q=Math.floor(+v);if(it.type=='barang'&&q>stk(i)){q=stk(i);toast('Qty disesuaikan dengan stok')}cart=q>0?cart.map(x=>x.i==i?{i,q}:x):cart.filter(x=>x.i!=i);dsC()}
function dsC(){const t=cart.reduce((s,x)=>s+x.q*item(x.i).price,0),tn=$('#pay').value=='tunai',k=(+$('#cash').value||0)-t;$('#cart').innerHTML=TB(['Item','Qty','Subtotal'],cart.map(x=>`<tr><td>${esc(nm(x.i))}</td><td><input type="number" value="${x.q}" min="0" style="width:64px" onchange="dsQ('${x.i}',this.value)"></td><td class="n">${rp(x.q*item(x.i).price)}</td></tr>`))+`<div class="rw"><b>Total</b><b class="big">${rp(t)}</b></div>`;$('#cl').style.display=tn?'grid':'none';$('#chg').innerHTML=tn&&t?(k>=0?`Kembalian: ${rp(k)}`:`<span class="dn">Kurang ${rp(-k)}</span>`):''}
function dsPay(){const t=cart.reduce((s,x)=>s+x.q*item(x.i).price,0),p=$('#pay').value;if(!cart.length)return toast('Keranjang masih kosong');if(p=='tunai'&&(+$('#cash').value||0)<t)return toast('Uang diterima kurang');D.trx.push({id:nid(),t:'sale',date:today(),pay:p,lines:cart.map(x=>({i:x.i,q:x.q,p:item(x.i).price}))});md.close();refresh();toast('Pembayaran berhasil. Jurnal, HPP FIFO, dan stok terupdate otomatis.')}
/* ===== boot ===== */
(async()=>{D=load();if(!D||!D.users){D=await seed();save()}mig();let s=null;try{s=sessionStorage.getItem('lk_u')}catch(e){}const u=s&&D.users.find(x=>x.u==s);lmode(D.users.length?0:1);if(!D.users.length)$('#lh').textContent='Pengguna pertama: daftar akun dulu untuk memulai.';if(u)start(u)})();
</script></body></html>
